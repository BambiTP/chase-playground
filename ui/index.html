<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Playground</title>
<style>
  :root { --bg: #15171c; --bar: #1d2027; --line: #2c3039; --text: #e6e8ec; --muted: #9399a6; --accent: #5aa2ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  button, input, select { font: inherit; color: var(--text); background: #262a33; border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  input[type=number] { width: 70px; }
  .muted { color: var(--muted); }
  .bar.map { padding-top: 6px; padding-bottom: 6px; }
  .bar label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .bar input.n { width: 52px; padding: 3px 5px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: #262a33; }
  .seg button.on { background: var(--accent); color: #06121f; font-weight: 600; }
  .hidden { display: none !important; }
  .rolled { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; top: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre; pointer-events: none; }
  .err { position: absolute; left: 12px; right: 12px; bottom: 12px; background: #3a1714; color: #ffb4ab; border: 1px solid #6b2a24; border-radius: 6px; padding: 8px 10px; font: 12px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div class="bar">
  <button class="primary" id="upload">Upload script</button>
  <input type="file" id="file" accept=".js" hidden>
  <span id="scriptName" class="muted">no script</span>
  <div class="sep"></div>
  <button id="play">Pause</button>
  <button id="step">Step</button>
  <button id="reset">Reset</button>
  <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <div class="sep"></div>
  <span class="muted">Arrow keys drive</span><select id="drive"></select>
</div>
<div class="bar map" id="mapBar">
  <span class="muted">Map</span>
  <span class="seg"><button id="modeFixed" class="on">Fixed</button><button id="modeMix">Mix</button></span>
  <span id="fixed">
    <label>seed <input class="n" type="number" id="fSeed" value="7"></label>
    <label>size <input class="n" type="number" id="fW" value="45" step="2" min="5"> × <input class="n" type="number" id="fH" value="45" step="2" min="5"></label>
    <label>left up <input class="n" type="number" id="fL" value="50" min="0" max="100">%</label>
    <label>right up <input class="n" type="number" id="fR" value="50" min="0" max="100">%</label>
    <label>45s <input class="n" type="number" id="f45" value="50" min="0" max="100">%</label>
  </span>
  <span id="mix" class="hidden">
    <label>width <input class="n" type="number" id="mWmin" value="31" step="2" min="5">–<input class="n" type="number" id="mWmax" value="59" step="2" min="5"></label>
    <label>height <input class="n" type="number" id="mHmin" value="31" step="2" min="5">–<input class="n" type="number" id="mHmax" value="59" step="2" min="5"></label>
    <label>left up <input class="n" type="number" id="mLmin" value="30">–<input class="n" type="number" id="mLmax" value="70">%</label>
    <label>right up <input class="n" type="number" id="mRmin" value="30">–<input class="n" type="number" id="mRmax" value="70">%</label>
    <label>45s <input class="n" type="number" id="m45min" value="0">–<input class="n" type="number" id="m45max" value="100">%</label>
    <label>open tiles <input class="n" type="number" id="mOmin" value="300" title="at least">–<input class="n" type="number" id="mOmax" value="" placeholder="any" title="at most"></label>
    <button id="roll" class="primary">New map</button>
    <label><input type="checkbox" id="rollOnReset"> new map on every reset</label>
  </span>
  <span id="rolled" class="rolled"></span>
  <button id="keep" class="hidden" title="copy this map's settings into Fixed">Keep</button>
  <span id="scriptMap" class="muted hidden">map comes from the script</span>
</div>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="err" id="err"></div>
</div>

<!-- load the engine's CommonJS files with a tiny require() so the page works opened from disk -->
<script>
  const MODS = {};
  window.require = (p) => {
    const name = p.split('/').pop().replace(/\.js$/, '');
    if (name === 'chase-playground' || name === '..' || name === '.') return MODS.index;
    if (!MODS[name]) throw new Error(`require('${p}'): not available here`);
    return MODS[name];
  };
  const load = (name) => { MODS[name] = window.module.exports; };
  window.module = { exports: {} };
</script>
<script src="../engine/box2d.js"></script><script>load('box2d'); module = { exports: {} };</script>
<script src="../src/rng.js"></script><script>load('rng'); module = { exports: {} };</script>
<script src="../src/maps.js"></script><script>load('maps'); module = { exports: {} };</script>
<script src="../src/mapgen.js"></script><script>load('mapgen'); module = { exports: {} };</script>
<script src="../src/world.js"></script><script>load('world'); module = { exports: {} };</script>
<script src="../index.js"></script><script>load('index'); delete window.module;</script>

<script>
const API = MODS.index;
const { Playground, generateMap, keysToString, PHYSICS: PH } = API;
const $ = (id) => document.getElementById(id);

let script = null;        // { map, setup(pg), tick(pg, state) } from the uploaded file
let pg = null, map = null;
let paused = false, acc = 0, last = performance.now();
const held = { up: false, down: false, left: false, right: false };
const trails = {};

// ---------- script ----------
// An uploaded script is a CommonJS file. Everything is optional:
//   module.exports = {
//     map: generateMap({ seed: 3 }) | fromAscii(`...`),   // default: the map row's settings
//     setup(pg) { pg.addBall(...) },                        // default: one red and one blue ball
//     tick(pg, state) { pg.setKeys(id, 'UR') },             // called before every tick
//   };
// require('chase-playground') gives Playground, generateMap, fromAscii, ...
function loadScript(text, name) {
  const module = { exports: {} };
  new Function('module', 'exports', 'require', text)(module, module.exports, window.require);
  script = module.exports;
  $('scriptName').textContent = name;
  $('scriptName').classList.remove('muted');
}

$('upload').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  try { loadScript(await f.text(), f.name); reset(); } catch (e) { fail(e); }
  $('file').value = '';
};

function fail(e) {
  paused = true; $('play').textContent = 'Run';
  $('err').textContent = (e && e.stack) || String(e);
  $('err').style.display = 'block';
}

// ---------- map row ----------
// Fixed: one map from the settings. Mix: random settings inside the ranges, rerolled until the
// map's open area (tiles a ball can reach) is inside the open-tiles range.
let mode = 'fixed', rolled = null;   // rolled: { opts, map } from the last Mix roll
const num = (id) => +$(id).value;
const odd = (n) => Math.max(5, n % 2 ? n : n + 1);
const between = (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return lo + Math.random() * (hi - lo); };
const openTiles = (m) => MODS.maps.spawnTiles(m).length;

function fixedOpts() {
  return { seed: num('fSeed'), width: odd(num('fW')), height: odd(num('fH')), randLeft: num('fL') / 100, randRight: num('fR') / 100, diagonals: num('f45') / 100 };
}

function roll() {
  const oMin = $('mOmin').value === '' ? 0 : num('mOmin'), oMax = $('mOmax').value === '' ? Infinity : num('mOmax');
  for (let i = 0; i < 300; i++) {
    const opts = {
      seed: Math.floor(Math.random() * 1e6),
      width: odd(Math.round(between(num('mWmin'), num('mWmax')))), height: odd(Math.round(between(num('mHmin'), num('mHmax')))),
      randLeft: Math.round(between(num('mLmin'), num('mLmax'))) / 100, randRight: Math.round(between(num('mRmin'), num('mRmax'))) / 100,
      diagonals: Math.round(between(num('m45min'), num('m45max'))) / 100,
    };
    const m = generateMap(opts), open = openTiles(m);
    if (open >= oMin && open <= oMax) return { opts, map: m, open };
  }
  throw new Error('Mix: no map in 300 tries fits these ranges (try a wider open tiles range)');
}

function describe(o, open) {
  return `seed ${o.seed} · ${o.width}×${o.height} · left ${Math.round(o.randLeft * 100)}% · right ${Math.round(o.randRight * 100)}% · 45s ${Math.round(o.diagonals * 100)}% · ${open} open tiles`;
}

function pickMap(newRoll) {
  if (mode === 'fixed') { const o = fixedOpts(), m = generateMap(o); $('rolled').textContent = `${openTiles(m)} open tiles`; return { map: m, seed: o.seed }; }
  if (newRoll || !rolled) rolled = roll();
  $('rolled').textContent = describe(rolled.opts, rolled.open);
  return { map: rolled.map, seed: rolled.opts.seed };
}

function setMode(m) {
  mode = m;
  $('modeFixed').classList.toggle('on', m === 'fixed'); $('modeMix').classList.toggle('on', m === 'mix');
  $('fixed').classList.toggle('hidden', m !== 'fixed'); $('mix').classList.toggle('hidden', m !== 'mix');
  $('keep').classList.toggle('hidden', m !== 'mix');
  reset();
}

// ---------- world ----------
function reset(newRoll) {
  $('err').style.display = 'none';
  try {
    const fromScript = !!(script && script.map);
    $('scriptMap').classList.toggle('hidden', !fromScript);
    let seed = 1;
    if (fromScript) { map = typeof script.map === 'function' ? script.map(API) : script.map; $('rolled').textContent = ''; }
    else ({ map, seed } = pickMap(newRoll === true || (mode === 'mix' && $('rollOnReset').checked)));
    pg = new Playground({ map, seed });
    if (script && script.setup) script.setup(pg);
    else { pg.addBall({ id: 'red', team: 1 }); pg.addBall({ id: 'blue', team: 2, minDistance: 10 }); }
  } catch (e) { pg = null; fail(e); return; }
  for (const k in trails) delete trails[k];
  const prev = $('drive').value;
  $('drive').innerHTML = '';
  $('drive').add(new Option('nothing', ''));
  for (const b of pg.balls) $('drive').add(new Option(b.id, b.id));
  $('drive').value = pg.byId[prev] ? prev : (script ? '' : pg.balls[0] ? pg.balls[0].id : '');
  paused = false; $('play').textContent = 'Pause'; acc = 0;
  fit();
}

function tick() {
  try { if (script && script.tick) script.tick(pg, pg.state()); } catch (e) { fail(e); return; }
  const you = $('drive').value;
  if (you && pg.byId[you]) pg.setKeys(you, held);
  pg.step();
  for (const b of pg.balls) {
    const p = b.body.GetPosition(), t = trails[b.id] || (trails[b.id] = []);
    t.push([p.x, p.y]); if (t.length > 90) t.shift();
  }
}

// ---------- drawing ----------
const cv = $('c'), g = cv.getContext('2d');
let layer = null, ts = 10, ox = 0, oy = 0;
const SHAPES = { 1.1: [[-.5, .5], [-.5, -.5], [.5, .5]], 1.2: [[-.5, -.5], [.5, -.5], [-.5, .5]], 1.3: [[.5, -.5], [.5, .5], [-.5, -.5]], 1.4: [[.5, .5], [-.5, .5], [.5, -.5]] };
const sx = (m) => ox + (m / PH.TILE + .5) * ts, sy = (m) => oy + (m / PH.TILE + .5) * ts;

function fit() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  if (!map) return;
  ts = Math.max(2, Math.floor(Math.min((cv.width - 40 * dpr) / map.width, (cv.height - 40 * dpr) / map.height)));
  ox = Math.floor((cv.width - ts * map.width) / 2); oy = Math.floor((cv.height - ts * map.height) / 2);
  layer = document.createElement('canvas'); layer.width = map.width * ts; layer.height = map.height * ts;
  const l = layer.getContext('2d');
  for (let x = 0; x < map.width; x++) for (let y = 0; y < map.height; y++) {
    const t = map.tiles[x][y];
    if (t === 0) continue;
    l.fillStyle = t === 1 ? '#8a8d93' : '#3a3d44'; l.fillRect(x * ts, y * ts, ts, ts);
    if (SHAPES[t]) {
      l.fillStyle = '#8a8d93'; l.beginPath();
      SHAPES[t].forEach(([a, b], i) => l[i ? 'lineTo' : 'moveTo']((x + .5 + a) * ts, (y + .5 + b) * ts));
      l.fill();
    }
  }
}
addEventListener('resize', fit);

function draw() {
  g.fillStyle = '#0d0e11'; g.fillRect(0, 0, cv.width, cv.height);
  if (!layer || !pg) return;
  g.drawImage(layer, ox, oy);
  const R = PH.BALL_RADIUS / PH.TILE * ts, you = $('drive').value;
  for (const b of pg.balls) {
    const col = b.team === 2 ? '#4a7ee8' : '#e8524a', t = trails[b.id] || [];
    if (t.length > 1) {
      g.strokeStyle = col; g.globalAlpha = .35; g.lineWidth = Math.max(1, R / 4); g.beginPath();
      t.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](sx(x), sy(y))); g.stroke(); g.globalAlpha = 1;
    }
    const p = b.body.GetPosition();
    g.fillStyle = col; g.beginPath(); g.arc(sx(p.x), sy(p.y), R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = b.id === you ? '#fff' : 'rgba(0,0,0,.5)'; g.lineWidth = Math.max(1, R / 6); g.stroke();
    g.fillStyle = '#fff'; g.font = `${Math.max(10, R)}px system-ui`; g.textAlign = 'center';
    g.fillText(b.id, sx(p.x), sy(p.y) - R - 4);
  }
}

function hud() {
  if (!pg) { $('hud').textContent = ''; return; }
  const lines = [`${map.name || 'map'}  ${map.width}×${map.height}   tick ${pg.tick}  ${(pg.tick / 60).toFixed(2)} s${paused ? '  PAUSED' : ''}`];
  for (const b of pg.balls) {
    const s = pg.ballState(b.id);
    lines.push(`${b.id.padEnd(8)} tile (${(s.x / PH.TILE).toFixed(1)}, ${(s.y / PH.TILE).toFixed(1)})  ${Math.hypot(s.vx, s.vy).toFixed(2)} m/s  ${s.keys || '-'}`);
  }
  const c = pg.contacts();
  if (c.length) lines.push('touching: ' + c.map((p) => p.join(' + ')).join(', '));
  $('hud').textContent = lines.join('\n');
}

function frame(now) {
  const dt = Math.min(250, now - last); last = now;
  if (pg && !paused) {
    acc += dt * +$('speed').value;
    while (acc >= 1000 / 60 && !paused) { acc -= 1000 / 60; tick(); }
  }
  draw(); hud();
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
addEventListener('keydown', (e) => {
  if (e.target.matches('input[type=number]')) return;
  if (KEYMAP[e.code]) { held[KEYMAP[e.code]] = true; e.preventDefault(); }
});
addEventListener('keyup', (e) => { if (KEYMAP[e.code]) held[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
// give the keyboard back to the arrows after using a control
addEventListener('change', (e) => { if (e.target.matches('select, input[type=checkbox]')) e.target.blur(); });
addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });

$('play').onclick = () => { paused = !paused; $('play').textContent = paused ? 'Run' : 'Pause'; };
$('step').onclick = () => { if (pg) { paused = true; $('play').textContent = 'Run'; tick(); } };
$('reset').onclick = () => reset();
$('modeFixed').onclick = () => setMode('fixed');
$('modeMix').onclick = () => setMode('mix');
$('roll').onclick = () => reset(true);
$('keep').onclick = () => {
  if (!rolled) return;
  const o = rolled.opts;
  $('fSeed').value = o.seed; $('fW').value = o.width; $('fH').value = o.height;
  $('fL').value = Math.round(o.randLeft * 100); $('fR').value = Math.round(o.randRight * 100); $('f45').value = Math.round(o.diagonals * 100);
  setMode('fixed');
};
for (const id of ['fSeed', 'fW', 'fH', 'fL', 'fR', 'f45']) $(id).addEventListener('change', () => reset());

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
